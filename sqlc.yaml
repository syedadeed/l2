version: "2"
sql:
  - engine: "postgresql"
    schema: "./db/migrations"
    queries: "./db/query"
    gen:
      go:
        emit_json_tags: true
        package: "repository"
        out: "db/repository"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "json"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "passkey_credentials.credential"
            go_type:
              import: "github.com/go-webauthn/webauthn/webauthn"
              type: "Credential"
